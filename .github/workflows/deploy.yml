name: Deploy to Hostinger FTP

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      server_dir:
        description: 'Directorio destino en FTP (ej: institutodfs/ o public_html/institutodfs/)'
        required: false
        default: 'institutodfs/'

jobs:
  web-deploy:
    name: 🚀 Build & Deploy to Hostinger
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci || npm install

      - name: 🔨 Build production app (Vite)
        run: npm run build

      - name: 📂 Sync files via FTP to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER || secrets.FTP_HOST || vars.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME || secrets.FTP_USER || vars.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || vars.FTP_PORT || 21 }}
          protocol: ${{ secrets.FTP_PROTOCOL || vars.FTP_PROTOCOL || 'ftp' }}
          # En Hostinger el usuario FTP ya inicia dentro de public_html (o del dominio),
          # por lo que no se debe poner '/domains/unke.com.ar/...'
          server-dir: ${{ github.event.inputs.server_dir || vars.FTP_SERVER_DIR || secrets.FTP_SERVER_DIR || 'institutodfs/' }}
          local-dir: ./dist/
          dangerous-clean-slate: false
          log-level: verbose

